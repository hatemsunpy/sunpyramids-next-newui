name: Mobile Lighthouse Audit

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-lighthouse.yml"
      - "scripts/performance-audit.mjs"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  AUDIT_ORIGIN: https://sunpyramids-next-newui.vercel.app
  AUDIT_PROFILE: mobile

jobs:
  cloud-mobile-audit:
    name: Home / mobile (3 live runs on Vercel deployment) + exploratory all-route sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2

      - name: Install toolchain (Lighthouse global, official Stable Chrome under RUNNER_TEMP)
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts lighthouse@13.5.0
          npm install --prefix "$RUNNER_TEMP/pwtool" --no-audit --no-fund --ignore-scripts playwright-core@1.62.1
          node "$RUNNER_TEMP/pwtool/node_modules/playwright-core/cli.js" install-deps chromium
          mkdir -p "$RUNNER_TEMP/chrome-stable"
          curl -fL --retry 3 https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.84/linux64/chrome-linux64.zip -o "$RUNNER_TEMP/chrome-stable.zip"
          unzip -q "$RUNNER_TEMP/chrome-stable.zip" -d "$RUNNER_TEMP/chrome-stable"
          mapfile -t exes < <(find "$RUNNER_TEMP/chrome-stable" -type f -name chrome)
          if [ "${#exes[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 chrome executable, found ${#exes[@]}:"
            printf '%s\n' "${exes[@]}"
            exit 1
          fi
          if [ ! -x "${exes[0]}" ]; then
            echo "::error::Chrome binary is not executable: ${exes[0]}"
            exit 1
          fi
          ver="$("${exes[0]}" --version)"
          echo "Browser ${exes[0]} -> $ver"
          case "$ver" in
            *155.0.8059.84*) ;;
            *) echo "::error::Unexpected browser version '$ver' (expected 155.0.8059.84)"; exit 1 ;;
          esac
          echo "CHROME_PATH=${exes[0]}" >> "$GITHUB_ENV"

      - name: Collect machine info (checkout SHA is NOT the deployed SHA)
        run: |
          set -euo pipefail
          mkdir -p output/performance
          node --input-type=module <<'NODE'
          import os from "node:os";
          import { execSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          const cpus = os.cpus();
          writeFileSync("output/performance/cloud-machine.json", JSON.stringify({
            os: `${os.type()} ${os.release()}`,
            cpu: { model: cpus[0]?.model, cores: cpus.length, speedMHz: cpus[0]?.speed },
            loadavg: os.loadavg(),
            memoryFreeBytes: os.freemem(),
            memoryTotalBytes: os.totalmem(),
            node: process.version,
            lighthouse: execSync("lighthouse --version").toString().trim(),
            browser: process.env.CHROME_PATH ?? null,
            browserVersion: process.env.CHROME_PATH ? execSync(`"${process.env.CHROME_PATH}" --version`).toString().trim() : null,
            requestedOrigin: process.env.AUDIT_ORIGIN,
            checkoutSha: execSync("git rev-parse HEAD").toString().trim(),
            checkoutShaNote: "Local checkout SHA (git rev-parse HEAD); it is NOT proof of the deployed SHA.",
            timestamp: new Date().toISOString(),
          }, null, 2));
          NODE

      - name: Run 3 sequential audits
        run: |
          set -uo pipefail
          overall=0
          for r in 1 2 3; do
            phase="cloud-mobile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-r${r}"
            echo "::group::Audit ${phase}"
            if ! node scripts/performance-audit.mjs "$phase" home; then
              echo "::error::Audit run failed: ${phase} (reports preserved; continuing remaining runs)"
              overall=1
            fi
            echo "::endgroup::"
          done
          echo "AUDIT_RUNS_STATUS=$overall" >> "$GITHUB_ENV"

      - name: Exploratory all-route sweep (not a gate)
        env:
          PHASE: full-mobile-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node scripts/performance-audit.mjs "$PHASE"

      - name: Diagnostic home CPU sampling (excluded from acceptance)
        if: always()
        env:
          AUDIT_JS_SAMPLING: "1"
          PHASE: diagnostic-mobile-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          echo "**Diagnostic CPU sampling:** scores below are diagnostic only and do NOT count toward the acceptance median/gate." >> "$GITHUB_STEP_SUMMARY"
          node scripts/performance-audit.mjs "$PHASE" home

      - name: Validate runs, summaries and SDKs (always runs)
        if: always()
        env:
          PHASES_BASE: cloud-mobile-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_LIGHTHOUSE: 13.5.0
          EXPECTED_BROWSER_VERSION: 155.0.8059.84
          MIN_MEDIAN: 70
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const base = process.env.PHASES_BASE, orig = process.env.AUDIT_ORIGIN;
          const apiHost = "sunpyramidtours.com";
          const issues = [], warnings = [], scores = [];
          const machineP = "output/performance/cloud-machine.json";
          let machine = null;
          if (!fs.existsSync(machineP)) issues.push(`missing browser-machine evidence: ${machineP}`);
          else {
            try { machine = JSON.parse(fs.readFileSync(machineP, "utf8")); } catch { issues.push(`${machineP} is not valid JSON`); }
            if (machine && (typeof machine !== "object" || Array.isArray(machine))) { issues.push(`${machineP} is not a JSON object`); machine = null; }
            if (machine && !(typeof machine.browserVersion === "string" && machine.browserVersion.includes(process.env.EXPECTED_BROWSER_VERSION))) {
              issues.push(`${machineP}: browserVersion=${JSON.stringify(machine.browserVersion)} does not include expected full version ${process.env.EXPECTED_BROWSER_VERSION}`);
              machine = null;
            }
          }
          const expectedMajor = String(process.env.EXPECTED_BROWSER_VERSION).split(".")[0];
          for (const r of ["r1", "r2", "r3"]) {
            const dir = `output/performance/${base}-${r}`;
            const sumP = `${dir}/summary.json`, lhrP = `${dir}/home-mobile.json`;
            if (!fs.existsSync(sumP)) { issues.push(`${r}: missing ${sumP}`); continue; }
            if (!fs.existsSync(lhrP)) { issues.push(`${r}: missing ${lhrP}`); continue; }
            let rows, lhr;
            try { rows = JSON.parse(fs.readFileSync(sumP, "utf8")); } catch { issues.push(`${r}: summary.json is not valid JSON`); continue; }
            try { lhr = JSON.parse(fs.readFileSync(lhrP, "utf8")); } catch { issues.push(`${r}: home LHR is not valid JSON`); continue; }
            if (!lhr || typeof lhr !== "object" || Array.isArray(lhr)) { issues.push(`${r}: LHR must be an object`); continue; }
            if (!Array.isArray(rows)) { issues.push(`${r}: summary.json is not an array`); continue; }
            const ok = rows.filter(x => x && x.name === "home" && x.profile === "mobile" && x.status === "ok" && x.httpStatus === 200 && x.bodyLength > 0);
            if (rows.length !== 1 || ok.length !== 1) {
              issues.push(`${r}: expected exactly 1 valid home/mobile HTTP200 nonempty ok row, got ${rows.length} row(s), ${ok.length} valid`); continue;
            }
            const row = ok[0];
            if (!row.scores || Object.values(row.scores).some(v => !Number.isFinite(v) || v < 0 || v > 100)) {
              issues.push(`${r}: summary scores are not finite 0..100`); continue;
            }
            if (lhr.runtimeError) { issues.push(`${r}: LHR runtimeError: ${lhr.runtimeError.message || JSON.stringify(lhr.runtimeError)}`); continue; }
            const lpc = lhr.categories?.performance?.score;
            if (!Number.isFinite(lpc) || lpc < 0 || lpc > 1 || Math.round(lpc * 100) !== row.scores.performance) {
              issues.push(`${r}: LHR performance score (${lpc}) does not match summary row score (${row.scores.performance})`); continue;
            }
            const isHome = (candidate, label) => {
              try {
                const u = new URL(candidate);
                return u.origin === orig && u.pathname === "/" && u.href === `${orig}/`;
              } catch { issues.push(`${r}: unparseable ${label}: ${candidate}`); return false; }
            };
            if (!isHome(row.requestedUrl, "row requestedUrl") | !isHome(row.url, "row final url")
              | !isHome(lhr.requestedUrl, "LHR requestedUrl") | !isHome(lhr.finalDisplayedUrl, "LHR finalDisplayedUrl")) {
              issues.push(`${r}: requested and final URLs must both be exactly ${orig}/`);
            }
            const cs = lhr.configSettings || {}, emu = [];
            if (cs.formFactor !== "mobile") emu.push(`formFactor=${cs.formFactor}`);
            if (!cs.screenEmulation || cs.screenEmulation.mobile !== true) emu.push("screenEmulation.mobile!=true");
            if (cs.throttlingMethod !== "simulate") emu.push(`throttlingMethod=${cs.throttlingMethod}`);
            if (lhr.lighthouseVersion !== process.env.EXPECTED_LIGHTHOUSE) emu.push(`lighthouse=${lhr.lighthouseVersion}!=${process.env.EXPECTED_LIGHTHOUSE}`);
            const hostUA = (lhr.environment && lhr.environment.hostUserAgent) || "";
            const uaMajor = /(?:^|\s|;)(?:Headless)?Chrome\/(\d+)\./.exec(hostUA);
            if (!uaMajor) emu.push(`hostUserAgent=${JSON.stringify(hostUA)} has no Chrome major`);
            else if (uaMajor[1] !== expectedMajor) emu.push(`hostUserAgent major=${uaMajor[1]} != expected ${expectedMajor} (full version ${process.env.EXPECTED_BROWSER_VERSION} from 155.0.0.0 UA reduction is accepted)`);
            else if (!machine) emu.push(`hostUserAgent verified to major ${expectedMajor}, but machine evidence (cloud-machine.json) is missing/malformed; full version unverified`);
            if (emu.length) issues.push(`${r}: unexpected audit settings: ${emu.join("; ")}`);
            const items = (lhr.audits["network-requests"]?.details?.items) || [];
            const rawCats = lhr.configSettings ? lhr.configSettings.additionalTraceCategories : null;
            const catStr = Array.isArray(rawCats) ? rawCats.join(",") : (rawCats == null ? "" : String(rawCats));
            if (catStr.includes("disabled-by-default-v8.cpu_profiler")) {
              issues.push(`${r}: home LHR configSettings.additionalTraceCategories contains disabled-by-default-v8.cpu_profiler; diagnostic CPU sampling must never appear in acceptance evidence`);
            }
            if (row.diagnosticOnly === true) {
              issues.push(`${r}: home summary row is diagnosticOnly; diagnostic scores must never be counted as acceptance`);
            }
            const urlOf = i => { try { return new URL(i.url); } catch { return null; } };
            const scripts = p => items.filter(i => i && urlOf(i) && i.resourceType === "Script" && i.statusCode === 200 && urlOf(i).pathname === p);
            const google = scripts("/gtm.js").some(i => urlOf(i).host.endsWith("googletagmanager.com"))
              || scripts("/gtag/js").some(i => urlOf(i).host.endsWith("googletagmanager.com"));
            const tagPath = u => u.pathname === "/tag" || u.pathname.startsWith("/tag/");
            const clarity = items.some(i => i && urlOf(i) && i.resourceType === "Script" && i.statusCode === 200
              && ((tagPath(urlOf(i)) && (urlOf(i).host === "clarity.ms" || urlOf(i).host === "www.clarity.ms")) || urlOf(i).host === "scripts.clarity.ms"));
            const tiktok = items.some(i => i && urlOf(i) && urlOf(i).host === "analytics.tiktok.com" && urlOf(i).pathname === "/i18n/pixel/events.js" && i.resourceType === "Script" && i.statusCode === 200);
            const apis = ["currencies", "countries"].map(a => items.some(i => i && urlOf(i) && urlOf(i).host === apiHost && urlOf(i).pathname === `/api/${a}` && (i.resourceType === "Fetch" || i.resourceType === "XHR") && i.statusCode === 200));
            if (!google) issues.push(`${r}: missing googletagmanager.com gtm.js/gtag/js Script 200`);
            if (!clarity) issues.push(`${r}: missing clarity.ms/tag or scripts.clarity.ms Script 200`);
            if (!tiktok) issues.push(`${r}: missing analytics.tiktok.com/i18n/pixel/events.js Script 200`);
            apis.forEach((okFlag, idx) => { if (!okFlag) issues.push(`${r}: missing ${apiHost} /api/${["currencies", "countries"][idx]} Fetch/XHR 200`); });
            if (!Number.isFinite(row.scores.performance)) { issues.push(`${r}: performance score missing/not finite`); continue; }
            scores.push({ run: r, ...row.scores });
            warnings.push({ run: r, warnings: Array.isArray(lhr.runWarnings) ? lhr.runWarnings : [String(lhr.runWarnings)] });
          }
          let median = null;
          if (scores.length === 3) {
            const s = scores.map(x => x.performance).sort((a, b) => a - b);
            median = s[1];
          } else issues.push(`cannot compute median: ${scores.length} of 3 runs validated`);
          if (median === null) issues.push("missing valid runs: median cannot prove gate");
          else if (median < Number(process.env.MIN_MEDIAN)) issues.push(`median performance ${median} is below gate ${process.env.MIN_MEDIAN}`);
          if (process.env.AUDIT_RUNS_STATUS === "1") issues.push("one or more audit invocations exited nonzero (see run step logs)");
          const gate = median !== null && median >= Number(process.env.MIN_MEDIAN) && issues.length === 0;
          fs.mkdirSync("output/performance", { recursive: true });
          const validated = { generatedAt: new Date().toISOString(), requestedOrigin: orig, note: "Homepage-only evidence for the Vercel deployment; SDK delivery alone does not prove all tracked events.", runs: scores, warnings, medianPerformance: median, minMedian: Number(process.env.MIN_MEDIAN), gate, issues };
          fs.writeFileSync("output/performance/cloud-validation.json", JSON.stringify(validated, null, 2));
          const rows = scores.map(s => `| ${s.run} | ${s.performance} | ${s.accessibility ?? "-"} | ${s["best-practices"] ?? "-"} | ${s.seo ?? "-"} |`).join("\n");
          const body = [
            "## Mobile Lighthouse cloud audit (home / mobile, 3 runs)",
            rows ? `| run | performance | accessibility | best-practices | seo |\n|---|---|---|---|---|\n${rows}` : "No validated runs.",
            `Median of all 3 performance scores: **${median ?? "N/A"}** (gate \u2265 ${process.env.MIN_MEDIAN}, no weak run dropped)`,
            `Gate: **${gate ? "PASS" : "FAIL"}**`,
            warnings.filter(w => w.warnings.length).map(w => `- ${w.run} warnings: ${w.warnings.join(" | ")}`).join("\n"),
            issues.length ? `### Failures\n${issues.map(i => `- ${i}`).join("\n")}` : "No issues.",
          ].filter(Boolean).join("\n\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body + "\n");
          issues.forEach(i => console.error("GATE ISSUE: " + i));
          if (!gate) process.exitCode = 1;
          NODE

      - name: Compact full-sweep summary (always runs; ONE exploratory all-route sweep)
        if: always()
        env:
          FULL_PHASE: full-mobile-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const fp = `output/performance/${process.env.FULL_PHASE}/summary.json`;
          const issues = [], rowsOut = [];
          let rows = null;
          if (!fs.existsSync(fp)) {
            issues.push(`missing ${fp}`);
          } else {
            try { rows = JSON.parse(fs.readFileSync(fp, "utf8")); } catch { issues.push(`${fp} is not valid JSON`); }
          }
          if (!Array.isArray(rows) || rows.length === 0) {
            if (rows !== null) issues.push(`${fp} is not a nonempty array`);
            rows = [];
          }
          if (rows.length !== 16) issues.push(`expected exactly 16 rows, got ${rows.length}`);
          const isValid = r => r && typeof r === "object" && !Array.isArray(r) && typeof r.name === "string" && r.name
            && r.diagnosticOnly !== true
            && r.profile === "mobile" && (r.status === "ok" || r.status === "redirected")
            && r.httpStatus === 200 && r.bodyLength > 0
            && r.scores && typeof r.scores === "object" && Number.isFinite(r.scores.performance)
            && r.scores.performance >= 0 && r.scores.performance <= 100;
          const okRows = rows.filter(isValid);
          const byName = new Map(okRows.map(r => [r.name, r]));
          const names = rows.map(r => (r && typeof r === "object" && typeof r.name === "string") ? r.name : "(unnameable)");
          const dupCounts = {};
          for (const n of names) dupCounts[n] = (dupCounts[n] || 0) + 1;
          const dups = Object.entries(dupCounts).filter(([, c]) => c > 1);
          if (dups.length) issues.push(`duplicate name rows: ${dups.map(([n, c]) => `${n}x${c}`).join(", ")}`);
          if (byName.size !== 16) {
            const missing = [];
            for (const r of rows) {
              if (!r || typeof r !== "object" || !r.name) continue;
              if (byName.has(r.name)) continue;
              missing.push(`${r.name}: status=${r.status ?? "-"} http=${r.httpStatus ?? "-"} error=${r.error ?? "(none reported)"}`);
            }
            issues.push(`expected 16 distinct route names with valid mobile rows, got ${byName.size}: ${[...byName.keys()].join(",") || "(none)"}`);
            issues.push(`failed/empty/missing route(s) (never counted as success): ${missing.join(" | ") || "(none reported)"}`);
          }
          for (const r of rows) {
            if (!r || typeof r !== "object") continue;
            const valid = byName.get(r.name) === r && isValid(r);
            const lp = r.metrics?.["largest-contentful-paint"], tbt = r.metrics?.["total-blocking-time"];
            if (valid && r.scores.performance < 70) issues.push(`${r.name}: performance score ${r.scores.performance} below 70`);
            rowsOut.push(`| ${r.name ?? "-"} | ${r.requestedUrl ?? "-"} | ${r.url ?? "-"} | ${r.status ?? "-"}${valid ? "" : " (INVALID)"} | ${r.httpStatus ?? "-"} | ${(r.scores && Number.isFinite(r.scores.performance)) ? r.scores.performance : "MISSING"} | ${Number.isFinite(lp) ? Math.round(lp) + " ms" : "MISSING"} | ${Number.isFinite(tbt) ? Math.round(tbt) + " ms" : "MISSING"} | ${(Array.isArray(r.warnings) && r.warnings.length) ? r.warnings.join("; ") : "-"} |`);
          }
          fs.mkdirSync("output/performance", { recursive: true });
          fs.writeFileSync("output/performance/full-validation.json", JSON.stringify({ generatedAt: new Date().toISOString(), phase: process.env.FULL_PHASE, note: "ONE exploratory all-route sweep; not three-run per-route medians or site-wide acceptance. Homepage has a separate three-run median>=70 gate.", runs: rows, validRoutes: [...byName.keys()], issues }, null, 2));
          const body = [
            "## Full-mobile sweep (ONE exploratory all-route sweep)",
            "ONE exploratory all-route sweep; not three-run per-route medians or site-wide acceptance. Homepage has a separate three-run median \u2265 70 gate.",
            rowsOut.length ? `| route | requested | final | status | http | perf | LCP | TBT | warnings |\n|---|---|---|---|---|---|---|---|---|\n${rowsOut.join("\n")}` : "No rows parsed.",
            issues.length ? `### Failures\n${issues.map(i => `- ${i}`).join("\n")}` : "No issues.",
          ].join("\n\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body + "\n");
          issues.forEach(i => console.error("SWEEP ISSUE: " + i));
          if (issues.length) process.exitCode = 1;
          NODE

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-lighthouse-cloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/performance/cloud-mobile-*-r?/*.json
            output/performance/cloud-mobile-*-r?/*.html
            output/performance/full-mobile-*/*.json
            output/performance/full-mobile-*/*.html
            output/performance/diagnostic-mobile-*/*.json
            output/performance/diagnostic-mobile-*/*.html
            output/performance/cloud-machine.json
            output/performance/cloud-validation.json
            output/performance/full-validation.json
          retention-days: 7
          if-no-files-found: error
